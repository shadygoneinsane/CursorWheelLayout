jdk:
  - openjdk21
env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC'"
install:
  - echo "Publishing lib-view and lib-compose"
  - ./gradlew clean :lib-view:publishToMavenLocal :lib-compose:publishToMavenLocal -x test --stacktrace
