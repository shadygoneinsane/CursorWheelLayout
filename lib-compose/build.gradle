plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.0'
}

android {
    namespace 'com.cursorwheel'
    compileSdk 37

    defaultConfig {
        minSdk 23
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation libs.annotation

    api platform(libs.compose.bom)
    api libs.compose.ui
    api libs.compose.foundation
    implementation libs.compose.animation
    implementation libs.compose.ui.tooling.preview
}

publishing {
    publications {
        release(MavenPublication) {
            afterEvaluate {
                from components["release"]
            }

            groupId = 'com.github.shadygoneinsane'
            artifactId = 'cursorwheel-compose'
            // JitPack passes -Pversion=<tag>; fall back to the local version otherwise
            version = (project.hasProperty('version') && project.version != 'unspecified') ? project.version : '2.2.0'
        }
    }
}
