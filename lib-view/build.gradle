plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.cursorwheel.view'
    compileSdk 37

    defaultConfig {
        minSdk 23
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.espresso.core
}

publishing {
    publications {
        release(MavenPublication) {
            afterEvaluate {
                from components["release"]
            }

            groupId = 'com.github.shadygoneinsane'
            artifactId = 'cursorwheel-view'
            // JitPack passes -Pversion=<tag>; fall back to the local version otherwise
            version = (project.hasProperty('version') && project.version != 'unspecified') ? project.version : '2.2.0'
        }
    }
}
